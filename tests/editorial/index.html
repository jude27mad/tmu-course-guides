<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Course guides · device review</title><style>
*{box-sizing:border-box}body{margin:0;background:#141c18;color:#edf2e9;font:13px system-ui}header{position:sticky;top:0;z-index:2;display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px;background:#1c2a22;border-bottom:1px solid #4c6151}button,select{font:inherit;padding:9px 10px;min-height:44px;border:1px solid #617361;border-radius:5px;background:#1c2a22;color:inherit}button[aria-pressed=true]{background:#c8e0bc;color:#172619}main{overflow:auto;padding:18px}#stage{position:relative;margin:auto}iframe{display:block;background:#f3f3ed;border:0;transform-origin:top left}label{font-size:12px;display:flex;align-items:center;gap:6px;min-height:44px}input{width:17px;height:17px}output{color:#bacab9;font-variant-numeric:tabular-nums}a{color:#c8e0bc}
</style></head><body><header><strong>Device review</strong><select id="course" aria-label="Course"><option value="mth140">Calculus</option><option value="mth141">Linear algebra</option><option value="cen100">Engineering</option></select><select id="device" aria-label="Device size"><option value="320,740">Small phone · 320</option><option value="360,800">Android small · 360</option><option value="390,844">iPhone · 390</option><option value="412,915">Android large · 412</option><option value="600,960">Small tablet · 600</option><option value="768,1024">Tablet · 768</option><option value="820,1180" selected>iPad portrait · 820</option><option value="1024,768">Tablet landscape · 1024</option><option value="1180,820">iPad landscape · 1180</option><option value="1366,768">PC laptop · 1366</option><option value="1920,1080">PC wide · 1920</option></select><select id="area" aria-label="Page area"><option value="">Assignments</option><option value="#course-info">Course info</option><option value="#math-lab">Math studio</option><option value="#guide-search">Search</option></select><label><input type="checkbox" id="fit" checked>Fit preview</label><label><input type="checkbox" id="motion">Still motion</label><button id="replay">Replay page</button><output id="size"></output></header><main><div id="stage"><iframe id="course-preview" title="Course guide at selected size" src="../../mth140/?v=overhaul2"></iframe></div></main><script>
const frame=document.getElementById('course-preview'),course=document.getElementById('course'),area=document.getElementById('area'),device=document.getElementById('device'),fit=document.getElementById('fit'),motion=document.getElementById('motion'),stage=document.getElementById('stage');
function load(){frame.src='../../'+(course.value==='cen100'?'':course.value+'/')+'?v=overhaul2'+(motion.checked?'&motion=off':'')+area.value;}
function resize(){const [w,h]=device.value.split(',').map(Number),scale=fit.checked?Math.min(1,(innerWidth-36)/w):1;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';document.getElementById('size').textContent=`${w} × ${h}`;}
course.addEventListener('change',load);area.addEventListener('change',load);motion.addEventListener('change',load);device.addEventListener('change',resize);fit.addEventListener('change',resize);window.addEventListener('resize',resize);document.getElementById('replay').addEventListener('click',()=>frame.contentWindow.location.reload());resize();
</script></body></html>
