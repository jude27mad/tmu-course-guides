<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Course guides · design review</title><style>
*{box-sizing:border-box}body{margin:0;background:#141c18;color:#edf2e9;font:14px system-ui}header{position:sticky;top:0;z-index:2;display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px;background:#1c2a22;border-bottom:1px solid #4c6151}button,select{font:inherit;padding:9px 11px;min-height:44px;border:1px solid #617361;border-radius:3px;background:#1c2a22;color:inherit}button[aria-pressed=true]{background:#c8e0bc;color:#172619}main{overflow:auto;padding:18px}iframe{display:block;width:820px;height:1100px;background:#f3f3ed;border:0;margin:auto}label{font-size:12px}a{color:#c8e0bc}
</style></head><body><header><strong>Design review</strong><select id="course" aria-label="Course"><option value="mth140">Calculus</option><option value="mth141">Linear algebra</option><option value="cen100">Engineering</option></select><button data-width="320" aria-pressed="false">320</button><button data-width="390" aria-pressed="false">Phone · 390</button><button data-width="820" aria-pressed="true">iPad · 820</button><button data-width="1024" aria-pressed="false">1024</button><button data-width="1280" aria-pressed="false">Desktop · 1280</button><select id="area" aria-label="Page area"><option value="">Header</option><option value="#math-lab">Math studio</option><option value="#guide-search">Search</option></select></header><main><iframe id="course-preview" title="Course guide at selected width" src="../../mth140/?v=editorial2"></iframe></main><script>
const frame=document.getElementById('course-preview'),course=document.getElementById('course'),area=document.getElementById('area');function load(){frame.src='../../'+(course.value==='cen100'?'':course.value+'/')+'?v=editorial2'+area.value;}course.addEventListener('change',load);area.addEventListener('change',load);document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
</script></body></html>
