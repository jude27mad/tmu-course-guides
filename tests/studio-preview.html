<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math studio · responsive review</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf2fb;font:14px system-ui}header{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#172237;border-bottom:1px solid #33415a}button,select{font:inherit;padding:9px 12px;min-height:44px;border:1px solid #60728f;border-radius:7px;background:#172237;color:inherit}button[aria-pressed=true]{background:#bda7ff;color:#211540}main{overflow:auto;padding:18px}iframe{display:block;width:820px;height:1050px;background:white;border:1px solid #52627a;border-radius:8px;margin:auto}span{margin-left:auto;font-size:12px;color:#d5ddea}
</style></head><body><header><strong>Responsive review</strong><select id="course" aria-label="Course"><option value="mth140">MTH140</option><option value="mth141">MTH141</option></select><button data-width="390" aria-pressed="false">Phone · 390</button><button data-width="820" aria-pressed="true">Tablet · 820</button><button data-width="1280" aria-pressed="false">Desktop · 1280</button><span>Development fixture · no saved progress is changed by these controls</span></header><main><iframe id="course-preview" title="Course guide at selected width" src="../mth140/?v=studio-review3#math-lab"></iframe></main><script>
const frame=document.getElementById('course-preview');document.getElementById('course').addEventListener('change',e=>frame.src=`../${e.target.value}/?v=studio-review3#math-lab`);document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b===button));}));
</script></body></html>
