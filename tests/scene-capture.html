<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actual course renderer capture</title>
<style>body{margin:0;background:#151e22;color:#fff;font:14px system-ui}.header-art{width:900px;height:600px;position:relative;overflow:hidden}canvas{width:100%;height:100%}.scene-poster{display:none}img{max-width:100%}pre{white-space:pre-wrap}</style>
<header><div class="header-art"></div></header><pre id="status">Loading actual renderer</pre><div id="captures"></div>
<script type="module">
// Dedicated capture fixture: retain actual GPU pixels; production buffers stay disposable.
const getContext=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,opts){return getContext.call(this,type,{...opts,preserveDrawingBuffer:true});};
const q=new URLSearchParams(location.search),course=q.get('course')||'cen100',art=document.querySelector('.header-art');
const {mountScene}=await import('../assets/course-scene.mjs?v=20261013-shift2');const handle=await mountScene(art,course);
setInterval(()=>{document.querySelector('#status').textContent=JSON.stringify(art.dataset);},500);
</script>
