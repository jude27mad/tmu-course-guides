<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course header responsive review</title>
<style>body{margin:0;background:#252b30;color:#fff;font:13px system-ui}header{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:12px;flex-wrap:wrap;background:#171d22}button,select{background:#343d46;color:white;border:1px solid #64717d;border-radius:5px;padding:8px}main{overflow:auto}iframe{display:block;margin:auto;border:0;width:390px;height:1100px;background:#faf9f3}button[aria-pressed=true]{background:#7054a0}output{margin-left:auto}</style>
<header><strong>Header review</strong><select aria-label="Course" id="course"><option value="cen100">CEN100</option><option value="mth140">MTH140</option><option value="mth141">MTH141</option></select><select aria-label="Viewport width" id="width"><option>320</option><option selected>390</option><option>412</option><option>600</option><option>768</option><option>820</option><option>1024</option><option>1366</option><option>1920</option></select><button id="pause" aria-pressed="false">Pause header</button><output id="result">Loading</output></header>
<main><iframe id="preview" title="Course guide preview"></iframe></main>
<script>
const frame=document.querySelector('iframe'),course=document.getElementById('course'),width=document.getElementById('width'),result=document.getElementById('result'),pause=document.getElementById('pause');
function navigate(){frame.src=new URL(course.value==='cen100'?'../index.html?motion=full':`../${course.value}/index.html?motion=full`,location.href).href;}
course.onchange=navigate;width.onchange=()=>frame.style.width=width.value+'px';pause.onclick=()=>{const button=frame.contentDocument.querySelector('.scene-pause');button?.click();pause.setAttribute('aria-pressed',pause.getAttribute('aria-pressed')!=='true');};
const query=new URLSearchParams(location.search);if(query.has("course"))course.value=query.get("course");if(query.has("width")){width.value=query.get("width");frame.style.width=width.value+"px";}
setInterval(()=>{try{const doc=frame.contentDocument,art=doc.querySelector('.header-art');if(!art)return;const r=art.getBoundingClientRect();result.textContent=JSON.stringify({course:doc.body.dataset.course,width:frame.contentWindow.innerWidth,overflow:doc.documentElement.scrollWidth>frame.contentWindow.innerWidth,art:[Math.round(r.width),Math.round(r.height)],renderer:art.dataset.renderer,frame:art.dataset.sceneFrame,version:art.dataset.artRevision});}catch{}},500);navigate();
</script></html>
