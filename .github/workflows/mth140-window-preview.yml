name: MTH140 window preview
on:
  push:
    branches: ['codex/mth140-window-preview']
    paths:
      - 'site/**'
      - '.github/workflows/mth140-window-preview.yml'
permissions:
  contents: write
concurrency:
  group: mth140-window-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Apply reviewed timing and layout correction
        run: |
          if test -f site/scripts/window-timing.patch; then
            git apply --check site/scripts/window-timing.patch
            git apply site/scripts/window-timing.patch
            rm site/scripts/window-timing.patch
          fi
      - run: npm ci
        working-directory: site
      - name: Match repository formatting and lint
        working-directory: site
        run: |
          npx prettier --write --print-width 200 src/pages/course/components/windows/ src/pages/course/components/deadlines/ src/pages/course/components/checklist/ src/pages/course/components/info/CourseInfo.jsx src/pages/course/components/info/styles/courseInfo.module.scss src/pages/course/course.module.scss 'src/pages/[course].page.jsx' tests/window-preview.test.mjs scripts/check-window-preview.mjs scripts/check-window-motion.mjs
          npx eslint --fix 'src/pages/[course].page.jsx' src/pages/course/components/windows/*.jsx src/pages/course/components/windows/*.mjs src/pages/course/components/deadlines/Deadlines.jsx src/pages/course/components/checklist/Checklist.jsx src/pages/course/components/info/CourseInfo.jsx
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install QA browser
        run: |
          npm install --prefix "$RUNNER_TEMP/window-qa" --no-save --package-lock=false playwright@1.64.0
          node "$RUNNER_TEMP/window-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check phones, tablets and desktops
        working-directory: site
        env:
          QA_REPORT_DIR: ${{ runner.temp }}/mth140-qa
        run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/window-qa/node_modules/playwright"
          node scripts/check-window-preview.mjs
          node scripts/check-window-motion.mjs
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mth140-window-qa
          path: ${{ runner.temp }}/mth140-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save exact tested source and export
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mth140-review"
          tar --exclude=node_modules --exclude=.next --exclude=out -czf "$RUNNER_TEMP/mth140-review/site-source.tar.gz" site
          if test -d site/out; then tar -czf "$RUNNER_TEMP/mth140-review/preview-export.tar.gz" -C site out; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mth140-review-build
          path: ${{ runner.temp }}/mth140-review/
          retention-days: 3
      - name: Commit verified source and screenshots to the feature branch only
        if: success()
        run: |
          test "${{ github.ref }}" = 'refs/heads/codex/mth140-window-preview'
          mkdir -p docs/qa/mth140-window-preview
          cp "$RUNNER_TEMP/mth140-qa/"*.json docs/qa/mth140-window-preview/
          cp "$RUNNER_TEMP/mth140-qa/phone390-assignments.png" "$RUNNER_TEMP/mth140-qa/phone390-help.png" "$RUNNER_TEMP/mth140-qa/tablet820-preparation.png" "$RUNNER_TEMP/mth140-qa/laptop1440-assignments.png" "$RUNNER_TEMP/mth140-qa/motion-desktop-group-2.png" docs/qa/mth140-window-preview/
          git config user.name 'Jude'
          git config user.email '229519885+jude27mad@users.noreply.github.com'
          git add -A site/src site/tests site/scripts docs/qa/mth140-window-preview
          if ! git diff --cached --quiet; then
            git commit -m 'Verify responsive windows, scrolling, motion preferences and saved progress'
            git push origin HEAD:codex/mth140-window-preview
          fi
