name: Pages

# Publishes the website at https://jude27mad.github.io/tmu-course-guides/: the site/ export built for
# that address, plus pages that forward the previous website's addresses and the old /next/ preview.
# Nothing else in the repository is published. The previous website's files stay in the repository,
# where ci.yml still tests them. Requires Settings -> Pages -> Source: GitHub Actions; with any other
# source the deploy is skipped, so switching the source back to the main branch is a full rollback.
# Changing the source does not start a run: after switching to GitHub Actions, run this workflow on
# main once (Actions -> Pages -> Run workflow) unless a push to site/ follows.
# A push to main whose code is exactly what a merged pull request's run checked and passed (the
# tree that run recorded, within 12 hours) skips the long browser checks: the data tests, the build
# and the basic browser check still run, and so does the live check after the deploy. Anything else
# (main changed after the pull request was checked, a direct push, a manual run) runs every check.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: true
  npm_config_audit: false
  npm_config_fund: false
  NEXT_TELEMETRY_DISABLED: 1
  SITE_BASE_PATH: /tmu-course-guides
  PLAYWRIGHT_VERSION: '1.64.0'

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-24.04
    # The existing browser checks take about 19 minutes; leave room for genuine
    # physics settling in review captures and normal runner variation.
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
      build_id: ${{ steps.build.outputs.build_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find the pull request run that checked this exact code
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pull request's run checks its head merged into main as main was then, and records
          # that tree when every check passed ("Record the checked tree", the job's last step).
          # Skip the long checks only if the newest such run of the merged pull request succeeded
          # within 12 hours (the site's content follows the clock) and recorded exactly the pushed
          # tree. Any API failure or doubt runs every check.
          tree="$(git rev-parse 'HEAD^{tree}')"
          now="$(date +%s)"
          tested=false
          heads="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha')" || heads=''
          for head in $heads; do
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || continue
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?event=pull_request&head_sha=$head" \
              --jq '.workflow_runs | sort_by(.created_at) | last | select(.conclusion == "success") | .id')" || run=''
            [[ "$run" =~ ^[0-9]+$ ]] || continue
            job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '.jobs[] | select(.name == "Build and check the site" and .conclusion == "success") | "\(.id) \(.completed_at)"')" || job=''
            read -r job_id completed <<< "$job"
            [[ "$job_id" =~ ^[0-9]+$ ]] || continue
            finished="$(date -d "$completed" +%s 2>/dev/null)" || continue
            (( now - finished <= 43200 )) || continue
            checked="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$job_id/annotations" \
              --jq '.[] | select(.title == "Checked tree") | .message')" || checked=''
            if [[ "$checked" == "$tree" ]]; then
              tested=true
              echo "::notice::Pull request run $run checked this exact tree; the long browser checks are skipped."
              break
            fi
          done
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Run data tests
        working-directory: site
        run: npm test
      - name: Build for the main address
        id: build
        working-directory: site
        run: |
          npm run build
          echo "build_id=$(cat .next/BUILD_ID)" >> "$GITHUB_OUTPUT"
      - name: Assemble and check the published files
        run: |
          node site/scripts/pages-site.mjs build --out site/out --dest "$RUNNER_TEMP/pages"
          node site/scripts/pages-site.mjs check "$RUNNER_TEMP/pages"
      - name: Install Playwright, Chromium and WebKit
        id: playwright
        env:
          TESTED: ${{ steps.tested.outputs.tested }}
        run: |
          # The Azure HTTP mirror has stalled browser dependency downloads for over 13 minutes.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          # Keep QA-only dependencies outside the checkout and site manifests, as ci.yml does.
          npm install --prefix "$RUNNER_TEMP/qa-playwright" --no-save --package-lock=false "playwright@$PLAYWRIGHT_VERSION"
          # The basic browser check needs Chromium only; WebKit is for the long checks.
          browsers='chromium webkit'
          if [[ "$TESTED" == true ]]; then browsers=chromium; fi
          node "$RUNNER_TEMP/qa-playwright/node_modules/playwright/cli.js" install --with-deps $browsers
      - name: Check the site in a browser
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa
        run: node site/scripts/check-pages-site.mjs --local "$RUNNER_TEMP/pages"
      - name: Check course views and saved work
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/course-views
        run: node site/scripts/verify-course-views.mjs
      - name: Upload course-view check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-views-qa
          path: ${{ runner.temp }}/pages-qa/course-views/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Search on every page
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/search
        run: node site/scripts/check-search-site.mjs
      - name: Upload Search check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-qa
          path: ${{ runner.temp }}/pages-qa/search/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check route transitions and Work filters
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/route-filter-qa
        run: node site/scripts/check-route-filter-motion.mjs
      - name: Upload route transition and filter recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-filter-qa
          path: ${{ runner.temp }}/route-filter-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check touch scrolling and fluid motion
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        working-directory: site
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/touch
        run: npm run test:touch
      - name: Check tap feedback and slow downloads
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/interaction-feedback
        run: node site/scripts/check-interaction-feedback.mjs
      - name: Check delayed feedback on fast and slow navigation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/delayed-feedback
        run: node site/scripts/check-delayed-feedback.mjs
      - name: Check the palette and take 390 px screenshots
        # Runs even when an earlier browser check failed, so one run reports everything.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/palette
        run: node site/scripts/check-palette-site.mjs "$RUNNER_TEMP/pages"
      - name: Check shared controls, navigation and information answers
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/consistency
        run: node site/scripts/check-consistency.mjs
      - name: Check glass controls in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/glass
        run: node site/scripts/check-glass-controls.mjs
      - name: Check glass controls in WebKit
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' && steps.tested.outputs.tested != 'true' }}
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa-playwright/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/pages-qa/glass
          QA_BROWSER: webkit
        run: node site/scripts/check-glass-controls.mjs
      - name: Upload reviewable site preview
        if: ${{ github.event_name == 'pull_request' && !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: ${{ runner.temp }}/pages/
          if-no-files-found: error
          retention-days: 7
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-site-qa
          path: ${{ runner.temp }}/pages-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check the Pages source
        id: source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploy only when Pages publishes from GitHub Actions. While it still publishes the main
          # branch (before the switch, or after a rollback), a deploy here would replace that site
          # until the next push, and the two would take turns. Pages not enabled (404) skips; any
          # other API failure fails the run, so a deploy is never skipped without a red run.
          if source="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$RUNNER_TEMP/pages-api.err")"; then
            :
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-api.err"; then
            source='not enabled'
          else
            cat "$RUNNER_TEMP/pages-api.err" >&2
            echo '::error::Could not read the Pages source; re-run this workflow.'
            exit 1
          fi
          if [[ "$source" == workflow ]]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: the Pages source is '${source:-unknown}', not GitHub Actions."
            echo deploy=false >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the Pages artifact
        if: steps.source.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Record the checked tree
        # Runs only when every step above succeeded, so every check passed on this tree: the pull
        # request's head merged into main as main is now. A push of exactly this tree to main
        # trusts it (see the first step) and skips the long browser checks.
        if: github.event_name == 'pull_request'
        run: echo "::notice title=Checked tree::$(git rev-parse 'HEAD^{tree}')"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  live-check:
    name: Check the live site
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Wait for the new build, then check the published addresses
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: node site/scripts/check-pages-site.mjs --live "$PAGE_URL" --build-id "$BUILD_ID"

