name: Task L settlement diagnostic

on:
  push:
    branches: [codex/ns-qa-fixes]
    paths: [.github/workflows/task-l-qa.yml]

permissions:
  contents: read

jobs:
  modes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify unchanged product and assertion sources
        run: |
          git diff --exit-code 83404b42b9d9e4c2bfdc12424d3749b904bf94d3 HEAD -- assets tests tools index.html cen100/index.html mth140/index.html mth141/index.html
          git rev-parse HEAD > "$RUNNER_TEMP/verified-commit.txt"
          printf '%s\n' 83404b42b9d9e4c2bfdc12424d3749b904bf94d3 > "$RUNNER_TEMP/product-commit.txt"
      - name: Install browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/qa-browser" --no-save playwright
          "$RUNNER_TEMP/qa-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/qa-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Record probe latency without changing checks or deadlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/qa/checks.mjs')
          source = p.read_text()
          old = 'if(await fn()) return;'
          new = "const started=Date.now(),ok=await fn();if(label==='route wrapper settlement')console.log('settlement-probe',JSON.stringify({ok,probeMs:Date.now()-started,remainingMs:end-Date.now()}));if(ok)return;"
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          PY
          git diff -- tools/qa/checks.mjs > "$RUNNER_TEMP/diagnostic-only.patch"
      - name: Repeat the unchanged modes gates at both bases
        run: |
          set -o pipefail
          node tools/qa/run.mjs modes | tee "$RUNNER_TEMP/modes-probe.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-l-modes-probe-${{ github.run_id }}
          path: |
            tools/qa/reports/
            ${{ runner.temp }}/modes-probe.log
            ${{ runner.temp }}/diagnostic-only.patch
            ${{ runner.temp }}/verified-commit.txt
            ${{ runner.temp }}/product-commit.txt
          retention-days: 7
