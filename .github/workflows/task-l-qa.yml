name: Task L verification

on:
  push:
    branches: [codex/ns-qa-fixes]

permissions:
  contents: read

concurrency:
  group: task-l-confirm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the polling boundary fix on the task branch only
        id: source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/ns-qa-fixes
          python3 - <<'PY'
          import os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          patch = 'tools/qa/task-l-poll.patch'
          if pathlib.Path(patch).exists():
              git('apply', '--check', '--index', patch)
              git('apply', '--index', patch)
              allowed = {'tools/qa/checks.mjs', 'tools/qa/checks.test.mjs', 'tools/qa/README.md'}
              changed = set(git('diff', '--cached', '--name-only').splitlines())
              assert changed == allowed, f'Unexpected patch paths: {changed ^ allowed}'
              git('rm', patch)
              git('diff', '--cached', '--check')
              print(git('-c', 'user.name=Jude', '-c', 'user.email=229519885+jude27mad@users.noreply.github.com', 'commit', '-m', 'Sample the current QA condition at the polling deadline', '-m', 'Do not mistake a late stale browser reply for a currently unsettled wrapper. Keep every acceptance predicate and polling budget; add boundary and persistent-failure regressions.'))
          remote = git('ls-remote', 'origin', 'refs/heads/codex/ns-qa-fixes').split()[0]
          assert remote == os.environ['EXPECTED_HEAD'], 'Task branch moved; refusing to overwrite work'
          git('push', 'origin', 'HEAD:refs/heads/codex/ns-qa-fixes')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + git('rev-parse', 'HEAD') + '\n')
          PY

  node:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [root, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/ui-build/package-lock.json
            tools/scene-build/package-lock.json
      - run: npm ci --prefix tools/ui-build && npm ci --prefix tools/scene-build
      - name: Verify the selected Node suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/verified-commit.txt"
          if test "$SUITE" = root; then
            node --test tests/*.test.mjs tests/scene-*.cjs | tee "$RUNNER_TEMP/qa-root.log"
          else
            (cd tools/ui-build && npm run build) | tee "$RUNNER_TEMP/qa-build.log"
            git diff --exit-code -- assets/vendor
            (cd tools/ui-build && npm test) | tee "$RUNNER_TEMP/qa-ui.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-l-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qa-*.log
            ${{ runner.temp }}/verified-commit.txt
          retention-days: 7

  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {check: layout, label: layout}
          - {check: routes, label: routes}
          - {check: modes, label: modes}
          - {check: deadlines, label: deadlines}
          - {check: frames, label: frames}
          - {check: stability, label: stability-root, base: /}
          - {check: stability, label: stability-subpath, base: /tmu-course-guides/}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/qa-browser" --no-save playwright
          "$RUNNER_TEMP/qa-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/qa-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Verify instrumentation independently
        if: matrix.check == 'routes'
        run: |
          set -o pipefail
          node --test tools/qa/checks.test.mjs tools/qa/runtime.test.mjs tools/qa/instrument.test.mjs | tee "$RUNNER_TEMP/qa-self.log"
      - name: Run the selected browser check at both bases
        env:
          CHECK: ${{ matrix.check }}
          BASE: ${{ matrix.base }}
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/verified-commit.txt"
          if test -n "$BASE"; then
            node tools/qa/run.mjs "$CHECK" --base "$BASE" | tee "$RUNNER_TEMP/qa-browser.log"
          else
            node tools/qa/run.mjs "$CHECK" | tee "$RUNNER_TEMP/qa-browser.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-l-${{ matrix.label }}-${{ github.run_id }}
          path: |
            tools/qa/reports/
            ${{ runner.temp }}/qa-*.log
            ${{ runner.temp }}/verified-commit.txt
          retention-days: 7
