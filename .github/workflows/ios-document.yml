name: iOS document scrolling
on:
  pull_request:
    branches: [main]
    paths: ['site/**', '.github/workflows/ios-document.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      SITE_BASE_PATH: /tmu-course-guides
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: site
      - name: Install WebKit
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"; fi
          done
          npm install --prefix "$RUNNER_TEMP/webkit" --no-save --package-lock=false playwright@1.64.0
          node "$RUNNER_TEMP/webkit/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Verify all routes in iPhone WebKit
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/webkit/node_modules/playwright
          QA_REPORT_DIR: ${{ runner.temp }}/ios-scroll
        run: node site/scripts/check-ios-document.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-document-qa
          path: ${{ runner.temp }}/ios-scroll/
          if-no-files-found: ignore
          retention-days: 7
