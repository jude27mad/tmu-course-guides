name: Task I verification
on:
  push:
    branches: [codex/ns-transition]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and verify tested implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/task-i-evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          url = 'https://api.github.com/repos/jude27mad/tmu-course-guides/git/blobs/783d50cff91590224fb988ffed097e7279b6cc6e'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response:
              blob = json.load(response)
          directory = pathlib.Path('/tmp/task-i-evidence')
          (directory / 'transport-blob.json').write_text(json.dumps(blob))
          encoded = ''.join(blob['content'].split())
          encoded = encoded.replace('VWUCb3Sp83fLKXkCU', 'VWUCb3Sp83zLXkCU')
          compressed = base64.b64decode(encoded + '===')
          (directory / 'candidate.patch.gz').write_bytes(compressed)
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'a13b32b8f49150fb8d2a8837263641aff5591b37cfd142dc07bb92bb148a34e2', 'Tested patch integrity check failed'
          (directory / 'implementation.patch').write_bytes(patch)
          print('Verified exact locally tested patch:', hashlib.sha256(patch).hexdigest())
          PY
          git apply --index /tmp/task-i-evidence/implementation.patch
          git rm .github/workflows/transition-verify.yml
          test "$(git write-tree)" = 0928b4725ec0730dba3cfc67bacc1d5245e14dd7
          git diff --cached --check
          git diff --cached --stat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/ui-build/package-lock.json
            tools/scene-build/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --prefix tools/ui-build && npm ci --prefix tools/scene-build
      - name: Root tests with full history
        run: node --test tests/*.test.mjs tests/scene-*.cjs | tee /tmp/task-i-evidence/root-tests.log
      - name: UI vendor build remains byte-identical
        run: |
          npm run build --prefix tools/ui-build | tee /tmp/task-i-evidence/ui-build.log
          git diff --exit-code -- assets/vendor
      - name: UI workflows and transition round trips
        run: npm test --prefix tools/ui-build | tee /tmp/task-i-evidence/ui-tests.log
      - name: Publish verified code only to task branch
        run: |
          test "$GITHUB_REF" = refs/heads/codex/ns-transition
          test "$(git ls-remote origin refs/heads/codex/ns-transition | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = 0928b4725ec0730dba3cfc67bacc1d5245e14dd7
          git diff --exit-code
          git config user.name Judecodex
          git config user.email 229519885+jude27mad@users.noreply.github.com
          git commit -m "Add bounded in-world transitions without blocking coursework" -m "Implement Task I registration, motion gates, cancellation and one-shot pose handoff. Preserve native links, history, focus and scroll. Add transition tests and real workflow stubs. Version router entry URLs to prevent stale script mixing. Remove the temporary verification runner after all checks pass."
          git push origin HEAD:refs/heads/codex/ns-transition
          git rev-parse HEAD > /tmp/task-i-evidence/verified-commit.txt
          git rev-parse HEAD^{tree} > /tmp/task-i-evidence/verified-tree.txt
          git bundle create /tmp/task-i-evidence/verified-repository.bundle --all HEAD
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-i-evidence
          path: /tmp/task-i-evidence/
          retention-days: 3
