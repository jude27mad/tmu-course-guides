name: Course loading probe
on:
  push:
    branches: [codex/fix-course-loading-flash]
    paths: [tools/probe-course-loading.cjs, .github/workflows/course-loading-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_BASE_PATH: /tmu-course-guides
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-save --package-lock=false playwright@1.64.0
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - run: node tools/probe-course-loading.cjs
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/qa/node_modules/playwright
