<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Light from the top-left: bright band, mid-tone, deep right side, bounce at the edge. -->
    <linearGradient id="cf-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FD6C5"/>
      <stop offset="0.2" stop-color="#6FF2E2"/>
      <stop offset="0.5" stop-color="#18BBA9"/>
      <stop offset="0.84" stop-color="#0B7A70"/>
      <stop offset="1" stop-color="#14978A"/>
    </linearGradient>
    <linearGradient id="cf-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#05524B" stop-opacity="0"/>
      <stop offset="1" stop-color="#05524B" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cf-rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#A6FFF3"/>
      <stop offset="0.35" stop-color="#5BEAD8"/>
      <stop offset="1" stop-color="#16A898"/>
    </linearGradient>
    <linearGradient id="cf-inside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#075F57"/>
      <stop offset="0.6" stop-color="#0E8579"/>
      <stop offset="1" stop-color="#2CC3B2"/>
    </linearGradient>
    <linearGradient id="cf-handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FE3D2"/>
      <stop offset="0.45" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0A6C63"/>
    </linearGradient>
    <radialGradient id="cf-coffee" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#A2602E"/>
      <stop offset="0.55" stop-color="#703818"/>
      <stop offset="1" stop-color="#43200B"/>
    </radialGradient>
    <linearGradient id="cf-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="0.6" stop-color="#FAE6C8"/>
      <stop offset="1" stop-color="#E9C595"/>
    </linearGradient>
    <linearGradient id="cf-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- steam: tapered wisps with a cool mid-tone; they fade in above the rim and out at the tip -->
    <linearGradient id="cf-steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#EBF1F9" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#D3DDEC" stop-opacity="0.95"/>
      <stop offset="0.84" stop-color="#C0CDE2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C0CDE2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cf-steam-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.02" stop-color="#7487AB" stop-opacity="0"/>
      <stop offset="0.17" stop-color="#7487AB" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#687CA0" stop-opacity="0.95"/>
      <stop offset="0.98" stop-color="#687CA0" stop-opacity="0"/>
    </linearGradient>
    <!-- bounce light along the bottom edge -->
    <linearGradient id="cf-bounce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#3ED8C6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3ED8C6" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="cf-body-clip">
      <path d="M96 198 C96 290 100 360 110 392 C116 420 160 440 214 440 C268 440 312 420 318 392 C328 360 332 290 332 198 A118 34 0 0 1 96 198 Z"/>
    </clipPath>
    <clipPath id="cf-mouth">
      <ellipse cx="214" cy="198" rx="103" ry="26"/>
    </clipPath>
  </defs>

  <!-- slightly scaled about the centre; contour widths are pre-compensated -->
  <g transform="translate(256 262) scale(0.95) translate(-264 -244)">
    <!-- steam wisps (behind the mug): left, centre, right (the right one mirrors the left, 10% shorter) -->
    <g fill="url(#cf-steam)" stroke="url(#cf-steam-edge)" stroke-width="5" stroke-linejoin="round">
      <path d="M170 172 C171 170 175 165 177 161.5 C179 157.5 180.5 153 181.5 149 C182 144.5 182 139.5 181.5 135 C181 130.5 179 126 177.5 121.5 C176 117.5 173.5 113.5 171.5 109.5 C169 106 167 102.5 165.5 99 C163.5 95.5 162 92.5 161 89.5 C160 86.5 159.5 83.5 159 80 C159 76.5 159.5 72.5 159.5 68.5 C160 64.5 161 58 161 56 C160 57.5 155.5 63 153.5 66.5 C151.5 70 149 74 148 78.5 C146.5 82.5 146 87.5 146.5 92 C146.5 96.5 147.5 101.5 149 106 C150.5 110 153 114.5 154.5 118.5 C156.5 122.5 159 126 160.5 129.5 C162.5 133 164 136 165 139.5 C166.5 142.5 167.5 145.5 168.5 148.5 C169 152 169.5 155.5 169.5 159.5 C170 163.5 170 170 170 172 Z"/>
      <path d="M212 172 C212 169.5 211 161 211 156.5 C211.5 151.5 211.5 147 212.5 143 C213.5 138.5 215 135 216.5 131 C218.5 127 221 123 223.5 118 C225.5 113.5 228.5 108.5 230.5 103 C232.5 97.5 234.5 91.5 234.5 85.5 C234.5 79.5 233.5 73 231.5 67.5 C229.5 62 225.5 57 222.5 52 C219 47.5 214.5 43 211.5 39 C208 34.5 203.5 28 201.5 26 C202.5 28.5 203.5 37 205 42.5 C206.5 48 210 53.5 211.5 58.5 C213.5 63 215 68 215.5 72 C216 76.5 216 79.5 215.5 83.5 C214.5 87 213 91 211.5 95 C209.5 99.5 207 104 205 109 C202.5 114 200 119.5 199 125.5 C198 131 197.5 137 198 142.5 C198.5 148 200.5 153.5 203 158.5 C205.5 163.5 210.5 169.5 212 172 Z"/>
      <path d="M258 172 C258 170 258 164 258.5 160.5 C258.5 157 259 154 259.5 151 C260.5 148 261.5 146 262.5 143 C264 140.5 265.5 138 267.5 135 C269 131.5 271 128.5 273 125 C275 121.5 277.5 117.5 278.5 113.5 C280 109.5 281.5 105 281.5 100.5 C282 96.5 281.5 92 280 88 C279 84 276.5 80.5 274.5 77 C272 74 268 69.5 267 68 C267 70 268 76 268.5 79.5 C269 83 269 86.5 269 89.5 C268.5 92.5 268 95 267 98 C266 100.5 264.5 103 263 106 C261 108.5 259 112 257 115 C255 118.5 252.5 122 250.5 126 C249 130 247 134.5 246.5 138.5 C246 142.5 246 147.5 246.5 151.5 C247.5 155.5 249 159 251 162.5 C253 166 257 170.5 258 172 Z"/>
    </g>

    <!-- handle (tucks behind the body) -->
    <path d="M306 250 C384 232 424 272 410 320 C398 360 352 372 306 356" fill="none" stroke="#07675E" stroke-width="43" stroke-linecap="round"/>
    <path d="M306 250 C384 232 424 272 410 320 C398 360 352 372 306 356" fill="none" stroke="url(#cf-handle)" stroke-width="33" stroke-linecap="round"/>
    <path d="M338 247 C372 243 393 257 400 280" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

    <!-- mug body -->
    <path d="M96 198 C96 290 100 360 110 392 C116 420 160 440 214 440 C268 440 312 420 318 392 C328 360 332 290 332 198 A118 34 0 0 1 96 198 Z" fill="url(#cf-body)"/>
    <g clip-path="url(#cf-body-clip)">
      <rect x="80" y="180" width="270" height="270" fill="url(#cf-shade)"/>
      <rect x="80" y="396" width="270" height="46" fill="url(#cf-bounce)"/>
      <!-- long specular streak on the lit side -->
      <path d="M124 240 C120 296 124 352 136 396" fill="none" stroke="url(#cf-shine)" stroke-width="16" stroke-linecap="round"/>
    </g>
    <path d="M96 198 C96 290 100 360 110 392 C116 420 160 440 214 440 C268 440 312 420 318 392 C328 360 332 290 332 198" fill="none" stroke="#07675E" stroke-width="5.25" stroke-linejoin="round"/>

    <!-- rim, inside wall, coffee -->
    <ellipse cx="214" cy="198" rx="118" ry="34" fill="url(#cf-rim)" stroke="#07675E" stroke-width="5.25"/>
    <ellipse cx="214" cy="198" rx="103" ry="26" fill="url(#cf-inside)"/>
    <g clip-path="url(#cf-mouth)">
      <ellipse cx="214" cy="204.5" rx="100" ry="25" fill="url(#cf-coffee)"/>
      <!-- crema ring at the edge of the coffee -->
      <ellipse cx="214" cy="204.5" rx="98" ry="24" fill="none" stroke="#C98B52" stroke-width="5" opacity="0.75"/>
      <!-- latte-art heart -->
      <path transform="translate(214 207) scale(0.72 0.46)" d="M0 30 C-10 20 -50 0 -50 -22 C-50 -42 -30 -52 -14 -46 C-6 -43 -2 -38 0 -32 C2 -38 6 -43 14 -46 C30 -52 50 -42 50 -22 C50 0 10 20 0 30 Z" fill="url(#cf-cream)"/>
    </g>
    <ellipse cx="214" cy="198" rx="103" ry="26" fill="none" stroke="#07675E" stroke-width="4.75"/>
    <!-- rim gloss and glint -->
    <path d="M108 207 A111 30.5 0 0 0 166 226" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="150" cy="258" r="6" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
