<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Polished gold gear seen slightly from above, so a side wall shows under the lower-right teeth.
         Light from the top-left: metal gradients run TL -> BR (edge, bright band, mid, deep, bounce). -->
    <linearGradient id="gr-face" x1="0.12" y1="0.1" x2="0.88" y2="0.9">
      <stop offset="0" stop-color="#F7B92A"/>
      <stop offset="0.2" stop-color="#FFE07A"/>
      <stop offset="0.5" stop-color="#FFBF2E"/>
      <stop offset="0.84" stop-color="#D88614"/>
      <stop offset="1" stop-color="#E99C24"/>
    </linearGradient>
    <!-- rounded edge around the teeth: a touch brighter on the lit side, deeper on the far side -->
    <linearGradient id="gr-bevel" x1="0.12" y1="0.1" x2="0.88" y2="0.9">
      <stop offset="0" stop-color="#FFE48E"/>
      <stop offset="0.3" stop-color="#FFD45A"/>
      <stop offset="0.5" stop-color="#FFBC30"/>
      <stop offset="0.85" stop-color="#DC8C18"/>
      <stop offset="1" stop-color="#EDA638"/>
    </linearGradient>
    <!-- side wall, turned away from the light -->
    <linearGradient id="gr-side" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#F0A324"/>
      <stop offset="0.45" stop-color="#D88210"/>
      <stop offset="1" stop-color="#B0600A"/>
    </linearGradient>
    <linearGradient id="gr-hub" x1="0.15" y1="0.12" x2="0.85" y2="0.88">
      <stop offset="0" stop-color="#FFD258"/>
      <stop offset="0.22" stop-color="#FFE68A"/>
      <stop offset="0.52" stop-color="#FFC236"/>
      <stop offset="0.86" stop-color="#D2800F"/>
      <stop offset="1" stop-color="#E5961F"/>
    </linearGradient>
    <!-- inner wall of the hole (upper-left side, in shadow) -->
    <linearGradient id="gr-wall" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0" stop-color="#6E3500"/>
      <stop offset="0.6" stop-color="#8E4A02"/>
      <stop offset="1" stop-color="#B8680A"/>
    </linearGradient>
    <!-- specular streak, fading out at both ends -->
    <linearGradient id="gr-shine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- everything except the see-through part of the centre hole -->
    <clipPath id="gr-hole">
      <path clip-rule="evenodd" d="M-200 -200H712V712H-200Z M221.9 280.5A42 42 0 0 0 296.1 243.5A42 42 0 0 0 221.9 280.5Z"/>
    </clipPath>
  </defs>
  <!-- scale 0.95: ~375 px box with ~5 px contours; the translate centres face + side wall on (256,256) -->
  <g transform="translate(256 256) scale(0.95) translate(-259 -262)">
    <g clip-path="url(#gr-hole)">
      <!-- silhouette contour: both outlines stroked at double width, then covered by the fills -->
      <g fill="none" stroke="#8A4700" stroke-width="10.6" stroke-linejoin="round">
