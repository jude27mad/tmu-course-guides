      <path d="M66.5 397.5 L379.6 400.8 L379.6 316.8 L66.5 313.5 Z" fill="url(#bk-grn-front)"/>
      <path d="M66.5 397.5 L379.6 400.8 L379.6 316.8 L66.5 313.5 Z" fill="url(#bk-green-fall)"/>
      <path d="M379.6 400.8 L449.1 357.6 L449.1 273.6 L379.6 316.8 Z" fill="url(#bk-grn-side)"/>
      <path d="M387.3 387 L445.7 350.8 Q438.7 322.1 445.7 284.8 L387.3 321 Q380.3 358.4 387.3 387 Z" fill="url(#bk-pages)" stroke="#04552F" stroke-opacity="0.5" stroke-width="4.25" stroke-linejoin="round"/>
      <path d="M390.7 368.4 L438 339 M390.7 351.9 L438 322.5 M390.7 335.4 L438 306" fill="none" stroke="#C9A468" stroke-width="4.25" stroke-linecap="round" opacity="0.7"/>
      <!-- one thin foil band near each end, spine gloss -->
      <path d="M96 397.8 L106 397.9 L106 313.9 L96 313.8 Z M322 400.2 L332 400.3 L332 316.3 L322 316.2 Z" fill="url(#bk-gold)"/>
      <path d="M102 334 Q102 329.5 106.5 329.5 L287.4 331.5 Q291.9 331.5 291.9 336 Q291.9 340.5 287.4 340.5 L106.5 338.5 Q102 338.5 102 334 Z" fill="url(#bk-shine)"/>
      <path d="M66.5 313.5 L379.6 316.8 L379.6 400.8" fill="none" stroke="#04552F" stroke-opacity="0.4" stroke-width="4.25" stroke-linejoin="round"/>
    </g>
    <path d="M66.5 381.5 Q66.5 397.5 82.5 397.6 L373.6 400.7 Q379.6 400.8 384.7 397.6 L442.3 361.9 Q449.1 357.6 449.1 349.6 L449.1 281.6 Q449.1 273.6 441.1 273.6 L144.1 270.4 Q136.1 270.3 129.3 274.5 L80.1 305 Q66.5 313.5 66.5 329.5 Z" fill="none" stroke="#04552F" stroke-width="5" stroke-linejoin="round"/>

    <!-- orange book: same 30-degree depth as the others -->
    <g clip-path="url(#bk-orange-clip)">
      <path d="M108.6 229.5 L170.6 193.5 L440 197.5 L378 233.5 Z" fill="url(#bk-org-top)"/>
      <path d="M311.9 240.7 L362.8 241.4 L439.7 198.4 L388.8 197.7 Z" fill="#8A3500" opacity="0.26"/>
      <path d="M108.6 303.5 L378 307.5 L378 233.5 L108.6 229.5 Z" fill="url(#bk-org-front)"/>
      <path d="M108.6 303.5 L378 307.5 L378 233.5 L108.6 229.5 Z" fill="url(#bk-org-fall)"/>
      <path d="M378 307.5 L440 271.5 L440 197.5 L378 233.5 Z" fill="url(#bk-org-side)"/>
      <path d="M385 294 L436.5 265 Q429.5 237 436.5 208 L385 238 Q378.5 266 385 294 Z" fill="url(#bk-pages)" stroke="#9A3F00" stroke-opacity="0.5" stroke-width="4.25" stroke-linejoin="round"/>
      <path d="M389 277.7 L430 254.4 M389 263.7 L430 240.3 M389 249.7 L430 226.1" fill="none" stroke="#C9A468" stroke-width="4.25" stroke-linecap="round" opacity="0.7"/>
      <!-- spine gloss and cream title label -->
      <path d="M165 247.8 Q165 243.3 169.5 243.4 L260.5 244.8 Q265 244.8 265 249.3 Q265 253.8 260.5 253.8 L169.5 252.4 Q165 252.3 165 247.8 Z" fill="url(#bk-shine)"/>
      <path d="M212.3 255.1 L274.3 255.9 Q278.3 256 278.3 260 L278.3 278 Q278.3 282 274.3 281.9 L212.3 281.1 Q208.3 281 208.3 277 L208.3 259 Q208.3 255 212.3 255.1 Z" fill="url(#bk-label)" stroke="#CC620E" stroke-width="4.25" stroke-linejoin="round"/>
      <path d="M108.6 229.5 L378 233.5 L378 307.5" fill="none" stroke="#9A3F00" stroke-opacity="0.4" stroke-width="4.25" stroke-linejoin="round"/>
    </g>
    <path d="M108.6 287.5 Q108.6 303.5 124.6 303.7 L372 307.4 Q378 307.5 383.2 304.5 L433.1 275.5 Q440 271.5 440 263.5 L440 205.5 Q440 197.5 432 197.4 L178.6 193.6 Q170.6 193.5 163.7 197.5 L122.4 221.5 Q108.6 229.5 108.6 245.5 Z" fill="none" stroke="#9A3F00" stroke-width="5" stroke-linejoin="round"/>

    <!-- ribbon bookmark tucked under the blue book, hanging over the orange spine -->
    <path d="M344 222 L364 222 C365 256 366 282 366 311 L355.5 298 L345 313 C345 284 344 256 344 222 Z" fill="url(#bk-ribbon)" stroke="#8E0C26" stroke-width="4.75" stroke-linejoin="round"/>
    <path d="M350 250 C350 268 351 280 351 294" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>

    <!-- blue book: cover, spine, tail with page block -->
    <g clip-path="url(#bk-blue-clip)">
      <path d="M62.9 154.3 L139.8 111.2 L427.7 116.4 L350.8 159.4 Z" fill="url(#bk-blue-top)"/>
      <path d="M62.9 236.3 L350.8 241.4 L350.8 159.4 L62.9 154.3 Z" fill="url(#bk-blue-front)"/>
      <path d="M62.9 236.3 L350.8 241.4 L350.8 159.4 L62.9 154.3 Z" fill="url(#bk-blue-fall)"/>
      <path d="M350.8 241.4 L427.7 198.4 L427.7 116.4 L350.8 159.4 Z" fill="url(#bk-blue-side)"/>
      <path d="M359.2 227.7 L423.8 191.5 Q416.1 163.8 423.8 127.5 L359.2 163.7 Q351.5 200 359.2 227.7 Z" fill="url(#bk-pages)" stroke="#0B2A86" stroke-opacity="0.5" stroke-width="4.25" stroke-linejoin="round"/>
      <path d="M363.1 209.5 L415.4 180.3 M363.1 193.5 L415.4 164.3 M363.1 177.5 L415.4 148.3" fill="none" stroke="#C9A468" stroke-width="4.25" stroke-linecap="round" opacity="0.7"/>
