<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- light from the top-left: lit top faces, mid fronts, shaded right ends -->
    <linearGradient id="bk-blue-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F7DF6"/>
      <stop offset="0.2" stop-color="#5E96FF"/>
      <stop offset="0.55" stop-color="#2664EC"/>
      <stop offset="0.88" stop-color="#1641B2"/>
      <stop offset="1" stop-color="#2353CC"/>
    </linearGradient>
    <linearGradient id="bk-blue-top" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#4E8BFB"/>
      <stop offset="0.2" stop-color="#76A9FF"/>
      <stop offset="0.6" stop-color="#3A77F4"/>
      <stop offset="1" stop-color="#2459DA"/>
    </linearGradient>
    <linearGradient id="bk-blue-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2052C8"/>
      <stop offset="1" stop-color="#11308A"/>
    </linearGradient>
    <linearGradient id="bk-org-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="0.2" stop-color="#FFC08A"/>
      <stop offset="0.55" stop-color="#FF8A1F"/>
      <stop offset="0.88" stop-color="#D9590A"/>
      <stop offset="1" stop-color="#E8701A"/>
    </linearGradient>
    <linearGradient id="bk-org-top" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#FFB066"/>
      <stop offset="0.2" stop-color="#FFC88F"/>
      <stop offset="0.6" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#F27A12"/>
    </linearGradient>
    <linearGradient id="bk-org-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0650A"/>
      <stop offset="1" stop-color="#A84400"/>
    </linearGradient>
    <linearGradient id="bk-grn-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1CC878"/>
      <stop offset="0.2" stop-color="#4DE7A0"/>
      <stop offset="0.55" stop-color="#11B366"/>
      <stop offset="0.88" stop-color="#077A44"/>
      <stop offset="1" stop-color="#0E9255"/>
    </linearGradient>
    <linearGradient id="bk-grn-top" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#32D888"/>
      <stop offset="0.2" stop-color="#62ECAB"/>
      <stop offset="0.6" stop-color="#1CC172"/>
      <stop offset="1" stop-color="#0FA25D"/>
    </linearGradient>
    <linearGradient id="bk-grn-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E9A57"/>
      <stop offset="1" stop-color="#06673A"/>
    </linearGradient>
    <!-- horizontal light fall-off along each spine -->
    <linearGradient id="bk-blue-fall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.22" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0B2A86" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2A86" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="bk-org-fall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.22" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A84000" stop-opacity="0"/>
      <stop offset="1" stop-color="#A84000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bk-green-fall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.22" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#04552F" stop-opacity="0"/>
      <stop offset="1" stop-color="#04552F" stop-opacity="0.32"/>
    </linearGradient>
    <!-- cream page blocks -->
    <linearGradient id="bk-pages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBEF"/>
      <stop offset="0.5" stop-color="#F5E6C2"/>
      <stop offset="1" stop-color="#E2C893"/>
