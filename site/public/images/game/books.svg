      <path d="M88.1 236.7 L100.8 236.9 L100.8 154.9 L88.1 154.7 Z M107.6 237.1 L113.4 237.2 L113.4 155.2 L107.6 155.1 Z M300.2 240.5 L306 240.6 L306 158.6 L300.2 158.5 Z M312.8 240.7 L325.5 241 L325.5 159 L312.8 158.7 Z" fill="url(#bk-gold)"/>
      <path d="M97.9 174.6 Q97.9 170.1 102.4 170.1 L265.6 173.1 Q270.1 173.1 270.1 177.6 Q270.1 182.1 265.6 182.1 L102.4 179.1 Q97.9 179.1 97.9 174.6 Z" fill="url(#bk-shine)"/>
      <!-- cover hinge groove -->
      <path d="M87.6 147.1 L356.1 152" fill="none" stroke="#0B2A86" stroke-opacity="0.45" stroke-width="4.25" stroke-linecap="round"/>
      <path d="M95.2 144 L361.8 148.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4.25" stroke-linecap="round"/>
      <!-- cover gloss -->
      <path d="M121.8 143.8 L160.7 144.5 L242.2 115.7 L203.2 115 Z" fill="url(#bk-gloss)"/>
      <path d="M176.2 144.7 L189.8 145 L271.3 116.2 L257.7 116 Z" fill="url(#bk-gloss)"/>
      <path d="M62.9 154.3 L350.8 159.4 L350.8 241.4" fill="none" stroke="#0B2A86" stroke-opacity="0.4" stroke-width="4.25" stroke-linejoin="round"/>
    </g>
    <path d="M62.9 220.3 Q62.9 236.3 78.8 236.5 L344.8 241.3 Q350.8 241.4 356 238.5 L420.7 202.3 Q427.7 198.4 427.7 190.4 L427.7 124.4 Q427.7 116.4 419.7 116.2 L147.8 111.4 Q139.8 111.2 132.8 115.1 L76.8 146.4 Q62.9 154.3 62.9 170.3 Z" fill="none" stroke="#0B2A86" stroke-width="5" stroke-linejoin="round"/>

  </g>
</svg>
