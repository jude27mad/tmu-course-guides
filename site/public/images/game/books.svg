      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.22" stop-color="#FFF4C8"/>
      <stop offset="0.55" stop-color="#F6C23E"/>
      <stop offset="0.9" stop-color="#C4840A"/>
      <stop offset="1" stop-color="#D99E1C"/>
    </linearGradient>
    <linearGradient id="bk-label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E4"/>
      <stop offset="0.25" stop-color="#FFFCF5"/>
      <stop offset="0.65" stop-color="#FFF1D6"/>
      <stop offset="1" stop-color="#F3D7AA"/>
    </linearGradient>
    <linearGradient id="bk-gloss" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
