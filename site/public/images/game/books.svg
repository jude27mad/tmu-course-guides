    <linearGradient id="bk-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C6C"/>
      <stop offset="0.3" stop-color="#FF3A52"/>
      <stop offset="0.75" stop-color="#D4163A"/>
      <stop offset="1" stop-color="#9E0C2C"/>
    </linearGradient>
    <linearGradient id="bk-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- book silhouettes -->
    <clipPath id="bk-green-clip"><path d="M66.5 381.5 Q66.5 397.5 82.5 397.6 L373.6 400.7 Q379.6 400.8 384.7 397.6 L442.3 361.9 Q449.1 357.6 449.1 349.6 L449.1 281.6 Q449.1 273.6 441.1 273.6 L144.1 270.4 Q136.1 270.3 129.3 274.5 L80.1 305 Q66.5 313.5 66.5 329.5 Z"/></clipPath>
    <clipPath id="bk-orange-clip"><path d="M108.6 287.5 Q108.6 303.5 124.6 303.7 L372 307.4 Q378 307.5 383.2 304.5 L433.1 275.5 Q440 271.5 440 263.5 L440 205.5 Q440 197.5 432 197.4 L178.6 193.6 Q170.6 193.5 163.7 197.5 L122.4 221.5 Q108.6 229.5 108.6 245.5 Z"/></clipPath>
    <clipPath id="bk-blue-clip"><path d="M62.9 220.3 Q62.9 236.3 78.8 236.5 L344.8 241.3 Q350.8 241.4 356 238.5 L420.7 202.3 Q427.7 198.4 427.7 190.4 L427.7 124.4 Q427.7 116.4 419.7 116.2 L147.8 111.4 Q139.8 111.2 132.8 115.1 L76.8 146.4 Q62.9 154.3 62.9 170.3 Z"/></clipPath>
  </defs>

