<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- aluminium, lit from the top-left -->
    <linearGradient id="lp-alu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9E1EE"/>
      <stop offset="0.2" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#E9EEF6"/>
      <stop offset="0.85" stop-color="#A9B5CC"/>
      <stop offset="1" stop-color="#C2CCDD"/>
    </linearGradient>
    <linearGradient id="lp-deck" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#D9E1EE"/>
      <stop offset="0.2" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E8EDF5"/>
      <stop offset="0.88" stop-color="#ADB8CD"/>
      <stop offset="1" stop-color="#C4CDDD"/>
    </linearGradient>
    <linearGradient id="lp-lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A7B2C8"/>
      <stop offset="0.2" stop-color="#CDD5E3"/>
      <stop offset="0.6" stop-color="#97A3BC"/>
      <stop offset="0.92" stop-color="#6E7B97"/>
      <stop offset="1" stop-color="#8591AC"/>
    </linearGradient>
    <linearGradient id="lp-occl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55617E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#55617E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lp-hinge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3247"/>
      <stop offset="0.55" stop-color="#4A5470"/>
      <stop offset="1" stop-color="#262C3E"/>
    </linearGradient>
    <linearGradient id="lp-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3550"/>
      <stop offset="1" stop-color="#111522"/>
    </linearGradient>
    <linearGradient id="lp-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#535E7C"/>
      <stop offset="0.5" stop-color="#353D58"/>
      <stop offset="1" stop-color="#262C41"/>
    </linearGradient>
    <linearGradient id="lp-pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FC"/>
      <stop offset="0.5" stop-color="#D3DAE7"/>
      <stop offset="1" stop-color="#B7C1D4"/>
    </linearGradient>
    <!-- wallpaper: deep blue to electric violet, magenta glow waves -->
    <linearGradient id="lp-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A8F"/>
      <stop offset="0.45" stop-color="#1B2EE0"/>
      <stop offset="1" stop-color="#4A1FD6"/>
    </linearGradient>
    <linearGradient id="lp-wave1" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#5A3BFF"/>
      <stop offset="0.5" stop-color="#7B2CF5"/>
      <stop offset="1" stop-color="#B21FE6"/>
    </linearGradient>
    <linearGradient id="lp-wave2" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#9A2AF0"/>
      <stop offset="0.5" stop-color="#D52AD0"/>
      <stop offset="1" stop-color="#FF46B0"/>
    </linearGradient>
    <linearGradient id="lp-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0570" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A0570" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="lp-crest" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0" stop-color="#FFC4F2" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#FFE2F8" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFC4F2" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lp-crest-glow" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0" stop-color="#FF7EE6" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FF7EE6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF7EE6" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="lp-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2B4BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lp-glow-m" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7ADB" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF3FA4" stop-opacity="0"/>
    </radialGradient>
    <!-- soft glass sheen in the lit top-left corner of the display -->
    <radialGradient id="lp-sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lp-shine" gradientUnits="userSpaceOnUse" x1="0" y1="312" x2="0" y2="410">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lp-lip-shine" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="236" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lp-deck-clip">
      <path d="M102 300L410 300Q420 300 424 309L464 410Q468 419 468 428L468 430Q468 440 458 440L54 440Q44 440 44 430L44 428Q44 419 48 410L88 309Q92 300 102 300Z"/>
    </clipPath>
    <clipPath id="lp-screen">
      <rect x="106" y="84" width="300" height="190" rx="6"/>
    </clipPath>
  </defs>
  <!-- scale 0.87: ~372 px wide; contours 5.6 local = ~4.9 px at 512 -->
  <g transform="translate(256 256) scale(0.87) translate(-256 -255)">
    <!-- keyboard deck -->
    <path d="M102 300L410 300Q420 300 424 309L464 410Q468 419 468 428L468 430Q468 440 458 440L54 440Q44 440 44 430L44 428Q44 419 48 410L88 309Q92 300 102 300Z" fill="url(#lp-deck)"/>
    <g clip-path="url(#lp-deck-clip)">
      <!-- soft shade under the hinge, then the slim front lip and its highlight -->
      <rect x="40" y="300" width="432" height="22" fill="url(#lp-occl)"/>
      <rect x="40" y="424" width="432" height="20" fill="url(#lp-lip)"/>
      <path d="M40 424H472" fill="none" stroke="#5E6A85" stroke-opacity="0.45" stroke-width="5"/>
      <path d="M62 432H230" fill="none" stroke="url(#lp-lip-shine)" stroke-width="5" stroke-linecap="round"/>
      <!-- specular streak along the lit left edge -->
      <path d="M100 312L60 410" fill="none" stroke="url(#lp-shine)" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path d="M102 300L410 300Q420 300 424 309L464 410Q468 419 468 428L468 430Q468 440 458 440L54 440Q44 440 44 430L44 428Q44 419 48 410L88 309Q92 300 102 300Z" fill="none" stroke="#5E6A85" stroke-width="5.6" stroke-linejoin="round"/>
    <!-- keys: no outline, so silver gaps keep the keyboard from reading as one dark slab -->
    <g fill="url(#lp-key)">
      <path d="M113.3 313H136.5L132 329H108ZM142.5 313H165.6L162.2 329H138.2ZM171.6 313H194.7L192.4 329H168.4ZM200.7 313H223.9L222.7 329H198.7ZM229.9 313H253L252.9 329H228.9ZM259 313H282.1L283.1 329H259.1ZM288.1 313H311.3L313.3 329H289.3ZM317.3 313H340.4L343.6 329H319.6ZM346.4 313H369.5L373.8 329H349.8ZM375.5 313H398.7L404 329H380Z"/>
      <path d="M106 335H145.5L141.6 351H100.6ZM151.5 335H176.2L173.4 351H147.8ZM182.2 335H206.9L205.2 351H179.6ZM212.9 335H237.6L237 351H211.4ZM243.6 335H268.4L268.8 351H243.2ZM274.4 335H299.1L300.6 351H275ZM305.1 335H329.8L332.4 351H306.8ZM335.8 335H360.5L364.2 351H338.6ZM366.5 335H406L411.4 351H370.4Z"/>
      <path d="M98.6 357H123.9L119.4 373H93.2ZM129.9 357H155.3L151.9 373H125.7ZM161.3 357H186.6L184.3 373H158.1ZM192.6 357H319.4L321.5 373H190.5ZM325.4 357H350.7L353.9 373H327.7ZM356.7 357H382.1L386.3 373H360.1ZM388.1 357H413.4L418.8 373H392.6Z"/>
    </g>
    <!-- trackpad -->
    <path d="M180 383H332L335 413H177Z" fill="url(#lp-pad)" stroke="#8592AD" stroke-width="4.6" stroke-linejoin="round"/>
    <!-- hinge: a slim dark gap -->
    <rect x="130" y="290" width="252" height="12" rx="6" fill="url(#lp-hinge)" stroke="#1E2434" stroke-width="5"/>
    <!-- lid: slim aluminium edge, thin black bezel, screen -->
    <rect x="92" y="70" width="328" height="224" rx="15" fill="url(#lp-alu)" stroke="#5E6A85" stroke-width="5.6"/>
    <rect x="99" y="77" width="314" height="210" rx="9" fill="url(#lp-bezel)"/>
    <g clip-path="url(#lp-screen)">
      <rect x="106" y="84" width="300" height="190" fill="url(#lp-wall)"/>
      <circle cx="176" cy="122" r="118" fill="url(#lp-glow-b)"/>
      <!-- glow waves -->
      <path d="M100 200C160 152 222 198 282 168C330 144 362 112 412 102V290H100Z" fill="url(#lp-wave1)"/>
      <path d="M100 200C160 152 222 198 282 168C330 144 362 112 412 102V290H100Z" fill="url(#lp-depth)"/>
      <path d="M100 246C170 214 232 248 302 220C348 202 378 176 412 166V290H100Z" fill="url(#lp-wave2)"/>
      <circle cx="372" cy="240" r="116" fill="url(#lp-glow-m)"/>
      <path d="M100 200C160 152 222 198 282 168C330 144 362 112 412 102M100 246C170 214 232 248 302 220C348 202 378 176 412 166" fill="none" stroke="url(#lp-crest-glow)" stroke-width="16"/>
      <path d="M100 200C160 152 222 198 282 168C330 144 362 112 412 102M100 246C170 214 232 248 302 220C348 202 378 176 412 166" fill="none" stroke="url(#lp-crest)" stroke-width="5"/>
      <!-- glass sheen -->
      <circle cx="122" cy="98" r="130" fill="url(#lp-sheen)"/>
    </g>
  </g>
</svg>
