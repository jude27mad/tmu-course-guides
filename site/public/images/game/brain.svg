<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Light from the top-left: bright band, mid-tone, deep bottom-right. -->
    <linearGradient id="br-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8CBD"/>
      <stop offset="0.19" stop-color="#FFB2D3"/>
      <stop offset="0.47" stop-color="#F65C9B"/>
      <stop offset="0.8" stop-color="#BA2469"/>
      <stop offset="1" stop-color="#9C195A"/>
    </linearGradient>
    <linearGradient id="br-cere" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F77BB0"/>
      <stop offset="0.22" stop-color="#FF9AC4"/>
      <stop offset="0.58" stop-color="#D93E87"/>
      <stop offset="0.88" stop-color="#9C1A5E"/>
      <stop offset="1" stop-color="#B42F72"/>
    </linearGradient>
    <linearGradient id="br-stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9579A"/>
      <stop offset="0.25" stop-color="#FF8EBE"/>
      <stop offset="0.6" stop-color="#D2397F"/>
      <stop offset="0.88" stop-color="#951A5B"/>
      <stop offset="1" stop-color="#AE2E6E"/>
    </linearGradient>
    <!-- bounce light along the bottom-right rim -->
    <radialGradient id="br-bounce" cx="0.3" cy="0.25" r="0.86">
      <stop offset="0.73" stop-color="#FF86BA" stop-opacity="0"/>
      <stop offset="0.83" stop-color="#FF86BA" stop-opacity="0.5"/>
    </radialGradient>
    <!-- specular streaks: bright near the top, fading out at both ends -->
    <linearGradient id="br-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="br-streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="br-clip">
